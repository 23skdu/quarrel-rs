name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt, clippy, tests and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install security tools
        run: cargo install cargo-audit cargo-deny --locked
      - run: make fmt-check
      - run: make fuzz-fmt-check
      - run: make precommit
      - run: make lint
      - run: make test
      - run: make security
      - run: make openapi-check
      - run: make metrics-check

  charts:
    name: helm and compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - run: make helm-lint
      - run: make helm-template
      - run: docker compose config --quiet

  containers:
    name: container definition validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make container-check

  tooling:
    name: benchtool and driver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test-benchtool

  fuzz:
    name: fuzz targets smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - run: make fuzz-smoke
