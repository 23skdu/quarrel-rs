name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt, clippy, tests and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install security tools
        run: cargo install cargo-audit cargo-deny --locked
      - run: make fmt-check
      - run: make lint
      - run: make test
      - run: make security
      - run: make openapi-check
      - run: make metrics-check

  charts:
    name: helm and compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-lint
      - run: make helm-template
      - run: docker compose config --quiet
