global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: quarrel-rs

rule_files:
  - /etc/prometheus/alerts/quarrel.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: quarrel
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["quarrel:8080"]
        labels:
          service: quarrel

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
