# Source: quarrel/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarrel
  labels:
    helm.sh/chart: quarrel-0.1.0
    app.kubernetes.io/name: quarrel
    app.kubernetes.io/instance: quarrel
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: quarrel-rs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quarrel
      app.kubernetes.io/instance: quarrel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarrel
        app.kubernetes.io/instance: quarrel
    spec:
      serviceAccountName: quarrel
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: quarrel
          image: "quarrel-rs:local"
          imagePullPolicy: IfNotPresent
          args:
            - "--listen=0.0.0.0:8080"
            - "--models-dir=/models"
          envFrom:
            - configMapRef:
                name: quarrel-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: quarrel-models
