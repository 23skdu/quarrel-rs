# Source: quarrel/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarrel
  labels:
    helm.sh/chart: quarrel-0.1.0
    app.kubernetes.io/name: quarrel
    app.kubernetes.io/instance: quarrel
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: quarrel-rs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: quarrel
      app.kubernetes.io/instance: quarrel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarrel
        app.kubernetes.io/instance: quarrel
    spec:
      serviceAccountName: quarrel
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: quarrel
          image: "quarrel-rs:local"
          imagePullPolicy: IfNotPresent
          args:
            - "--listen=0.0.0.0:8080"
            - "--models-dir=/models"
          envFrom:
            - configMapRef:
                name: quarrel-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: quarrel-models
---
# Source: quarrel/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: quarrel
  labels:
    helm.sh/chart: quarrel-0.1.0
    app.kubernetes.io/name: quarrel
    app.kubernetes.io/instance: quarrel
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: quarrel-rs
    release: prometheus
spec:
  groups:
    - name: quarrel.rules
      rules:
        - alert: QuarrelHighErrorRate
          expr: |
            sum(rate(quarrel_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(quarrel_requests_total[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "quarrel 5xx rate above 5%"
        - alert: QuarrelUnavailable
          expr: up{job=~".*quarrel.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "quarrel target is down"
---
