# Monitoring-enabled render:
#   helm template quarrel helm/quarrel -f helm/quarrel/values-monitoring.yaml
# The Prometheus Operator must be installed for the CRDs to be accepted by the
# cluster; this file only changes what the chart renders.

replicaCount: 2

persistence:
  size: 20Gi

# Traces are exported only when the image is built with the `otel` feature.
# These are the standard OpenTelemetry variables read by tracing-opentelemetry.
config:
  extraEnv:
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4317

startupProbe:
  enabled: true
  failureThreshold: 30
  periodSeconds: 5

readinessProbe:
  periodSeconds: 5

# Allow clients in this namespace and scrapes from the monitoring namespace;
# keep egress permissive (model downloads and DNS need it).
networkPolicy:
  enabled: true
  ingressPeers:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  egressRules: []

monitoring:
  serviceMonitor:
    enabled: true
    interval: 10s
    scrapeTimeout: 5s
    labels:
      release: prometheus
  prometheusRule:
    enabled: true
    labels:
      release: prometheus
  grafanaDashboard:
    enabled: true
    folder: /tmp/dashboards/quarrel-rs
