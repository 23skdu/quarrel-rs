replicaCount: 1

image:
  repository: quarrel-rs
  tag: "local"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8080

config:
  logJson: true
  rustLog: "info,quarrel_server=debug"
  # When set, rendered into a Secret and required for every /v1/* request.
  apiKey: ""

persistence:
  enabled: true
  # Set existingClaim to reuse a PVC that already holds your GGUF models.
  existingClaim: ""
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  storageClass: ""
  mountPath: /models

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: quarrel.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 30
