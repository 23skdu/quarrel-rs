# Default values for the quarrel chart.

replicaCount: 1

image:
  repository: quarrel-rs
  tag: "local"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod-level security context (applies to every container in the pod).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security context for the quarrel container.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8080

config:
  logJson: true
  rustLog: "info,quarrel_server=debug"
  # When set, rendered into a Secret and required for every /v1/* request.
  apiKey: ""
  # Extra environment variables rendered into the ConfigMap. Use this for the
  # standard OTEL_EXPORTER_OTLP_* variables when the image has the `otel` feature.
  extraEnv: {}

# GGUF model storage. Either let the chart create a PVC or point existingClaim
# at one that is already populated; mountPath is passed to --models-dir.
persistence:
  enabled: true
  # Set existingClaim to reuse a PVC that already holds your GGUF models.
  existingClaim: ""
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  storageClass: ""
  mountPath: /models
  readOnly: true

# Optional GPU scheduling. When enabled the device resource below is added to
# both container requests and limits; extraRequests/extraLimits allow for
# vendor-specific resources such as nvidia.com/gpumem.
gpu:
  enabled: false
  resourceName: nvidia.com/gpu
  count: 1
  extraRequests: {}
  extraLimits: {}
  # Optional RuntimeClass selecting a GPU-enabled runtime, e.g. "nvidia".
  runtimeClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# Each probe accepts arbitrary Kubernetes probe fields. Set enabled: false to
# omit the probe entirely (useful for custom or externally managed probes).
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: false
  httpGet:
    path: /healthz
    port: http
  failureThreshold: 30
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: quarrel.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Restrict traffic to the pod. The default rules allow the HTTP port from any
# peer and unrestricted egress; supply peers/rules to tighten them.
networkPolicy:
  enabled: false
  labels: {}
  # List of NetworkPolicyPeer objects. Empty means "from any peer".
  ingressPeers: []
  # List of NetworkPolicyEgressRule objects. Empty means "to any destination".
  egressRules: []

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    # Optional scrape timeout, e.g. 10s; empty uses the Prometheus default.
    scrapeTimeout: ""
    # Extra labels, typically the Prometheus Operator selector label.
    labels: {}
    # Standard ServiceMonitor relabelings applied to scrape targets.
    relabelings: []
    # Standard ServiceMetric relabelings applied before storage.
    metricRelabelings: []
  prometheusRule:
    enabled: false
    # Extra labels, typically the Prometheus Operator selector label.
    labels: {}
    # Additional PrometheusRule rules appended after the baseline alerts.
    additionalRules: []
  grafanaDashboard:
    # Publish the committed overview dashboard as a ConfigMap that Grafana's
    # sidecar can discover in the release namespace.
    enabled: false
    label: grafana_dashboard
    value: "1"
    annotations: {}
    # Optional k8s-sidecar target folder annotation value.
    folder: ""

nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 30
